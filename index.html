<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F-16A Exploded View</title>
  <meta name="description" content="Take an F-16A apart and put it back together in 3D." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono&display=swap" />
  <link rel="stylesheet" href="style.css?v=7" />
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body class="mode-airframe">
  <canvas id="stage" tabindex="0" aria-label="3D view. Airframe: drag to orbit, scroll to zoom. Flight deck: drag or use arrow keys to look around."></canvas>

  <header class="hud-top">
    <h1><span class="type" id="title">F-16A</span> <span class="sub" id="subtitle">Airframe · exploded view</span></h1>
    <nav class="modes" aria-label="View mode">
      <a href="#airframe" data-mode="airframe">Airframe</a>
      <a href="#cockpit" data-mode="cockpit">Cockpit</a>
    </nav>
  </header>

  <p id="status" class="status" role="status" aria-live="polite">Acquiring airframe <span class="num" data-ghost="888">0</span>%</p>

  <div id="lock" hidden aria-hidden="true"><span id="tip"></span></div>

  <div id="heading" class="heading" aria-hidden="true">
    <div class="heading-ticks"></div>
    <span class="num" id="hdg" data-ghost="888">000</span>
  </div>
  <p id="hint" class="hint">Drag to look around</p>
  <p id="cstatus" class="status" role="status" aria-live="polite" hidden></p>

  <label class="tape">
    <span class="tape-label">SEP</span>
    <input id="explode" type="range" min="0" max="1000" step="10" value="0" aria-label="Separation" disabled />
  </label>

  <footer class="hud-bottom">
    <p class="readout" aria-hidden="true">
      <span>SEP <span class="num" id="sep" data-ghost="888">0</span>%</span>
      <span><span class="num" data-ghost="88">10</span> sections</span>
    </p>
    <button id="toggle" type="button" aria-pressed="false" disabled>Disassemble</button>
    <p id="credit">
      <span class="credit-airframe">Model: <a href="https://sketchfab.com/3d-models/f16a-8e318343bf174e8f955707df54cb1fa6" target="_blank" rel="noopener">F16A</a> by <a href="https://sketchfab.com/amf1re" target="_blank" rel="noopener">amf1re</a></span>
      <span class="credit-cockpit"><a href="https://sketchfab.com/3d-models/boeing-757-200-icelandair-cockpit-1cb8f8109cb145849282ad703a652859" target="_blank" rel="noopener">Boeing 757-200 Icelandair Cockpit</a> by <a href="https://sketchfab.com/VTX" target="_blank" rel="noopener">VTX</a>, modified · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></span>
    </p>
  </footer>

  <script>
    // shown if three.js / main.js can't load (offline, CDN down) or WebGL is unavailable
    window.__loadFail = () => {
      const s = document.getElementById("status");
      s.hidden = false; s.classList.add("error");
      s.textContent = "Couldn't load the 3D viewer. Check your connection and reload the page.";
    };
  </script>
  <script type="module" src="main.js?v=7" onerror="__loadFail()"></script>
</body>
</html>
